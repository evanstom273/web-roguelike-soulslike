<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Warrior mockup, strictly top-down, facing +x, light from the top-left. 1 unit = 1 world px. -->
  <defs>
    <radialGradient id="g-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e1f1c"/>
      <stop offset="0.55" stop-color="#6a1414"/>
      <stop offset="1" stop-color="#3d0b0c"/>
    </linearGradient>
    <linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8bcc0"/>
      <stop offset="0.45" stop-color="#7d8287"/>
      <stop offset="1" stop-color="#3f4347"/>
    </linearGradient>
    <linearGradient id="g-steel-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d9196"/>
      <stop offset="1" stop-color="#2f3236"/>
    </linearGradient>
    <radialGradient id="g-helm" cx="35%" cy="32%" r="75%">
      <stop offset="0" stop-color="#c9cdd1"/>
      <stop offset="0.5" stop-color="#7f8489"/>
      <stop offset="1" stop-color="#34373b"/>
    </radialGradient>
    <linearGradient id="g-fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6650"/>
      <stop offset="1" stop-color="#3b2f24"/>
    </linearGradient>
    <linearGradient id="g-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="1" stop-color="#36230f"/>
    </linearGradient>
  </defs>

  <ellipse id="contact-shadow" cx="47" cy="50" rx="34" ry="30" fill="url(#g-shadow)"/>

  <!-- Cape: hangs from the shoulders and flares out behind, ragged hem. -->
  <g id="cape" stroke="#1a0606" stroke-width="1.2" stroke-linejoin="round">
    <path fill="url(#g-cape)" d="M44 22 C34 20 25 23 19 30 L16 33 L19 36 L14 41 L18 44 L13 49 L16 51 L13 56 L18 59 L15 63 L20 66 C25 72 34 76 44 74 Z"/>
    <!-- folds -->
    <path fill="none" stroke="#3a0a0b" stroke-width="1.4" d="M38 25 C30 33 27 42 28 49 M37 71 C29 64 26 56 27 49 M32 29 C24 38 22 46 22 52"/>
    <path fill="none" stroke="#b33a32" stroke-width="0.9" stroke-opacity="0.7" d="M40 23.5 C31 26 25 31 21 36"/>
  </g>

  <!-- Arms: vambraces and gauntlets reaching forward. -->
  <g id="arm-left" stroke="#16181a" stroke-width="1.2" stroke-linejoin="round">
    <path fill="url(#g-leather)" d="M50 26 C56 24 62 25 66 28 L64 33 C60 31 55 31 51 32 Z"/>
    <path fill="url(#g-steel)" d="M57 25.5 L66 27.5 L65 33 L56 31.5 Z"/>
    <path fill="none" stroke="#e4e7ea" stroke-width="0.7" stroke-opacity="0.8" d="M58 26.5 L65 28"/>
    <g id="gauntlet-left">
      <path fill="url(#g-steel-dark)" d="M65 27 C69 26 73 27.5 74 30.5 C73.5 33.5 70 34.5 66 33.5 Z"/>
      <path fill="none" stroke="#16181a" stroke-width="0.7" d="M69 27 L68.5 34 M71.5 27.8 L71.3 33.8"/>
    </g>
  </g>
  <g id="arm-right" stroke="#16181a" stroke-width="1.2" stroke-linejoin="round">
    <path fill="url(#g-leather)" d="M50 70 C56 72 62 71 66 68 L64 63 C60 65 55 65 51 64 Z"/>
    <path fill="url(#g-steel)" d="M57 70.5 L66 68.5 L65 63 L56 64.5 Z"/>
    <path fill="none" stroke="#e4e7ea" stroke-width="0.7" stroke-opacity="0.6" d="M57.5 65.3 L64.5 64"/>
    <g id="gauntlet-right">
      <path fill="url(#g-steel-dark)" d="M65 69 C69 70 73 68.5 74 65.5 C73.5 62.5 70 61.5 66 62.5 Z"/>
      <path fill="none" stroke="#16181a" stroke-width="0.7" d="M69 69 L68.5 62 M71.5 68.2 L71.3 62.2"/>
    </g>
  </g>

  <!-- Cuirass: the breastplate seen from above is just the top rim of the shoulders and chest. -->
  <g id="cuirass" stroke="#16181a" stroke-width="1.3">
    <path fill="url(#g-steel-dark)" d="M38 30 C44 26 54 27 58 33 C61 40 61 56 58 63 C54 69 44 70 38 66 C35 58 35 38 38 30 Z"/>
    <path fill="none" stroke="#a9aeb3" stroke-width="0.8" stroke-opacity="0.7" d="M40 31 C46 28.5 53 29.5 56.5 34"/>
    <!-- leather baldric across the chest -->
    <path fill="url(#g-leather)" stroke-width="1" d="M41 29.5 L45 28.5 L59 61 L55 64 Z"/>
    <circle cx="51" cy="47" r="1.6" fill="#b08a3e" stroke="#3a2a10" stroke-width="0.7"/>
  </g>

  <!-- Fur mantle: a shaggy collar around the neck, under the helm. -->
  <g id="fur-mantle" stroke="#1e1610" stroke-width="1.1" stroke-linejoin="round">
    <path fill="url(#g-fur)" d="M42 25 L38 27 L40 30 L35 33 L38 36 L34 40 L37 43 L33 47 L37 50 L33 54 L37 57 L34 61 L38 64 L36 68 L41 70 C47 72 55 69 57 63 C60 55 60 41 57 33 C55 27 48 24 42 25 Z"/>
    <path fill="none" stroke="#a48c6c" stroke-width="0.8" stroke-opacity="0.75" d="M40 31 L43 33 M38 37 L41 38 M37 43 L40 43.5 M36 49 L39 49 M45 28 L47 31 M50 27.5 L51 30.5"/>
    <path fill="none" stroke="#241a12" stroke-width="0.8" d="M37 55 L40 54 M38 61 L41 59.5 M42 66 L44 63.5 M48 68 L49 65 M53 66.5 L53 63.5"/>
  </g>

  <!-- Pauldrons: three overlapping lames each, rivets on the top plate. -->
  <g id="pauldron-left" transform="translate(1 3)" stroke="#16181a" stroke-width="1.2" stroke-linejoin="round">
    <path fill="#3d4044" d="M33 30 C33 20 44 15 54 19 C58 21 58 27 55 31 C49 34 39 34 33 30 Z"/>
    <path fill="url(#g-steel-dark)" d="M34 28 C35 20 44 16.5 52 19.5 C55.5 21 55.5 26 53 29 C47 31.5 39 31.5 34 28 Z"/>
    <path fill="url(#g-steel)" d="M36 25.5 C37.5 19.5 44 17.5 50 19.5 C53 20.7 53 24 51 26.5 C46 28.5 40 28.5 36 25.5 Z"/>
    <path fill="none" stroke="#eef0f2" stroke-width="0.8" stroke-opacity="0.85" d="M38 22.5 C40.5 19.8 45 19 48.5 20"/>
    <circle cx="40" cy="25.3" r="0.9" fill="#d6d9dc" stroke-width="0.5"/>
    <circle cx="46" cy="26.4" r="0.9" fill="#d6d9dc" stroke-width="0.5"/>
  </g>
  <g id="pauldron-right" transform="translate(1 -3)" stroke="#16181a" stroke-width="1.2" stroke-linejoin="round">
    <path fill="#2e3134" d="M33 66 C33 76 44 81 54 77 C58 75 58 69 55 65 C49 62 39 62 33 66 Z"/>
    <path fill="url(#g-steel-dark)" d="M34 68 C35 76 44 79.5 52 76.5 C55.5 75 55.5 70 53 67 C47 64.5 39 64.5 34 68 Z"/>
    <path fill="url(#g-steel-dark)" d="M36 70.5 C37.5 76.5 44 78.5 50 76.5 C53 75.3 53 72 51 69.5 C46 67.5 40 67.5 36 70.5 Z"/>
    <path fill="none" stroke="#c4c8cc" stroke-width="0.7" stroke-opacity="0.55" d="M37.5 70 C41 68 46 67.8 50 69.3"/>
    <circle cx="40" cy="70.7" r="0.9" fill="#a9adb1" stroke-width="0.5"/>
    <circle cx="46" cy="69.6" r="0.9" fill="#a9adb1" stroke-width="0.5"/>
  </g>

  <!-- Great helm: rounded crown with a raised ridge; visor slit just showing at the front edge. -->
  <g id="helm" stroke="#141618" stroke-width="1.3">
    <ellipse cx="49" cy="48" rx="11.5" ry="10.5" fill="url(#g-helm)"/>
    <!-- visor brow at the front, with the eye slit just catching the edge -->
    <path fill="url(#g-steel-dark)" stroke-width="1.1" d="M56.5 40.5 C60.5 43 61.5 53 56.5 55.5 L59 55 C62.5 52 62.5 44 59 41 Z"/>
    <path fill="#050505" stroke="none" d="M59.4 43.8 L60.6 44.2 L60.6 51.8 L59.4 52.2 Z"/>
    <path fill="none" stroke="#25282b" stroke-width="1.2" stroke-linecap="round" d="M39.5 49 L58 49"/>
    <path fill="none" stroke="#e9ecee" stroke-width="1" stroke-linecap="round" d="M39.5 47.3 L58 47.3"/>
    <path fill="none" stroke="#f4f6f7" stroke-width="1.1" stroke-opacity="0.7" stroke-linecap="round" d="M42 41.5 C45 39.3 50 39 53 40.2"/>
    <circle cx="46" cy="55" r="0.8" fill="#9a9ea2" stroke-width="0.4"/>
    <circle cx="52" cy="55" r="0.8" fill="#9a9ea2" stroke-width="0.4"/>
  </g>
</svg>
